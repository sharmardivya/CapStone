# Render Blueprint for the A2A Travel Planner.
# Deploys the browser chatbot as one web service; the four A2A agents start
# inside the same service on internal ports 8001–8004.
#
# To use it: Render Dashboard → New → Blueprint → choose this repository and
# the branch; Render finds this file at the repository root automatically.
services:
  - type: web
    name: a2a-travel-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_chatbot.py --no-browser
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: OPENAI_API_KEY
        sync: false   # secret: Render asks you to enter it; never commit it
